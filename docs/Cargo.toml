[package]
name = "hornero-docs"
description = "The hornero guide and API reference. Their Rust code blocks are compiled, or checked against real files, or explicitly justified."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[example]]
name = "hello"
test = true

# Everything below is only used by the guide's code blocks (doctests), examples and tests.
[dev-dependencies]
garde.workspace = true
hornero = { workspace = true, features = ["swagger-ui"] }
hornero-config.workspace = true
hornero-sea-orm = { workspace = true, features = ["sqlite"] }
hornero-testing.workspace = true
hornero-validation.workspace = true
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http = { workspace = true, features = ["cors", "fs", "timeout", "request-id", "util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
