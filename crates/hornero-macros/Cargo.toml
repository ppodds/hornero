[package]
name = "hornero-macros"
description = "Procedural macros for hornero: #[module], #[derive(Injectable)], #[injectable], #[controller], #[routes]"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[features]
# Emit OpenAPI descriptions; enabled through `hornero`'s `openapi` feature, whose paths they use.
openapi = []

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
