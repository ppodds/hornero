[package]
name = "hornero-core"
description = "Core DI container, module system and HTTP pipeline for hornero"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# axum's `Multipart` extractor, whose errors keep axum's status (400, 413) when forwarded with `?`.
multipart = ["axum/multipart"]

[dependencies]
axum.workspace = true
bytes.workspace = true
http.workspace = true
http-body.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
# Itself with every feature, so `cargo test -p hornero-core` covers them.
hornero-core = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["io-util"] }
insta.workspace = true
tracing-subscriber.workspace = true
