[package]
name = "hornero"
description = "A NestJS-style web framework for Rust: modules, DI, guards and interceptors on top of axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# OpenAPI documents inferred from the route table and handler signatures, as `hornero::openapi`.
openapi = ["dep:hornero-openapi", "hornero-macros/openapi"]
# `openapi` plus Swagger UI served next to the document.
swagger-ui = ["openapi", "hornero-openapi/swagger-ui"]

[dependencies]
axum.workspace = true
hornero-core.workspace = true
hornero-macros.workspace = true
hornero-openapi = { workspace = true, optional = true }
tower.workspace = true

[dev-dependencies]
insta.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
trybuild.workspace = true
